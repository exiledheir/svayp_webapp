name: Deploy web.svaypai.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            set -e
            cd ~/svayp_webapp
            # Копия на VM — зеркало ветки, а не самостоятельный репозиторий: своих
            # коммитов здесь не бывает, поэтому сливать нечего.
            #
            # Было `git pull origin main`, и деплой падал на любом переписывании
            # истории: git видел разошедшиеся ветки и требовал выбрать стратегию
            # слияния. fetch + reset --hard приводит копию ровно к состоянию ветки,
            # чем бы ни закончилась история на сервере.
            git fetch origin main
            git reset --hard origin/main
            cd swipe-web
            docker compose up -d --build
            echo "✅ Deployed successfully"
